<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Pomodorino icon sketches</title>
<style>
  body { background:#111; color:#ddd; font-family:system-ui,sans-serif; margin:2rem; }
  .intro { color:#999; max-width:60rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(380px,1fr)); gap:2rem; margin-top:2rem; }
  figure { margin:0; background:#1b1b1b; border-radius:16px; padding:1.2rem; }
  .row { display:flex; align-items:flex-end; gap:1.5rem; }
  .small { display:flex; flex-direction:column; align-items:center; gap:.4rem; color:#777; font-size:.8rem; }
  h2 { margin:.9rem 0 .2rem; font-size:1.15rem; color:#fff; } p { margin:.3rem 0; line-height:1.4; }
</style></head><body>
<h1>Pomodorino: icon sketches</h1>
<p class="intro">Eight launcher icons, each drawn in the spirit of a different artist (original drawings, not copies of
specific works). The small one is the real size on the Forerunner 165 (54×54 px) on black, which is what matters most.</p>
<div class="grid">
  <figure>
    <div class="row"><img src="mondrian_256.png" width="256" height="256" alt="Piet Mondrian style icon">
      <div class="small"><img src="mondrian_54.png" width="54" height="54" alt=""><span>real size</span></div></div>
    <figcaption><h2>1 · Piet Mondrian</h2><p>De Stijl: primary color blocks on a black grid. The red block is the tomato.</p></figcaption>
  </figure>

  <figure>
    <div class="row"><img src="kandinsky_256.png" width="256" height="256" alt="Wassily Kandinsky style icon">
      <div class="small"><img src="kandinsky_54.png" width="54" height="54" alt=""><span>real size</span></div></div>
    <figcaption><h2>2 · Wassily Kandinsky</h2><p>Concentric rings of color on deep blue, with floating geometric accents.</p></figcaption>
  </figure>

  <figure>
    <div class="row"><img src="matisse_256.png" width="256" height="256" alt="Henri Matisse style icon">
      <div class="small"><img src="matisse_54.png" width="54" height="54" alt=""><span>real size</span></div></div>
    <figcaption><h2>3 · Henri Matisse</h2><p>Paper cut-outs: a wobbly red tomato with leafy green on ultramarine.</p></figcaption>
  </figure>

  <figure>
    <div class="row"><img src="warhol_256.png" width="256" height="256" alt="Andy Warhol style icon">
      <div class="small"><img src="warhol_54.png" width="54" height="54" alt=""><span>real size</span></div></div>
    <figcaption><h2>4 · Andy Warhol</h2><p>Pop-art silkscreen: four panels of the same tomato in clashing colors.</p></figcaption>
  </figure>

  <figure>
    <div class="row"><img src="lichtenstein_256.png" width="256" height="256" alt="Roy Lichtenstein style icon">
      <div class="small"><img src="lichtenstein_54.png" width="54" height="54" alt=""><span>real size</span></div></div>
    <figcaption><h2>5 · Roy Lichtenstein</h2><p>Comic panel: Ben-Day dots, black ink outlines, a "POM!" burst.</p></figcaption>
  </figure>

  <figure>
    <div class="row"><img src="hokusai_256.png" width="256" height="256" alt="Katsushika Hokusai style icon">
      <div class="small"><img src="hokusai_54.png" width="54" height="54" alt=""><span>real size</span></div></div>
    <figcaption><h2>6 · Katsushika Hokusai</h2><p>Ukiyo-e: an indigo wave with foam, the tomato rising like the sun.</p></figcaption>
  </figure>

  <figure>
    <div class="row"><img src="klimt_256.png" width="256" height="256" alt="Gustav Klimt style icon">
      <div class="small"><img src="klimt_54.png" width="54" height="54" alt=""><span>real size</span></div></div>
    <figcaption><h2>7 · Gustav Klimt</h2><p>Golden mosaic, spirals and eye motifs; an ornamented, jewel-like tomato.</p></figcaption>
  </figure>

  <figure>
    <div class="row"><img src="dali_256.png" width="256" height="256" alt="Salvador Dalí style icon">
      <div class="small"><img src="dali_54.png" width="54" height="54" alt=""><span>real size</span></div></div>
    <figcaption><h2>8 · Salvador Dalí</h2><p>Surrealist: a tomato-clock melting over a ledge in a dreamlike desert.</p></figcaption>
  </figure>
</div></body></html>
