<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Pomodorino photo icons</title>
<style>
  body { background:#111; color:#ddd; font-family:system-ui,sans-serif; margin:2rem; }
  .intro { color:#999; max-width:60rem; } a { color:#ffb000; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); gap:2rem; margin-top:1.5rem; }
  figure { margin:0; background:#000; border-radius:16px; padding:1.2rem; border:1px solid #222; }
  .row { display:flex; align-items:flex-end; gap:1.5rem; }
  .small { display:flex; flex-direction:column; align-items:center; gap:.4rem; color:#777; font-size:.8rem; }
  .watch { display:flex; align-items:center; gap:14px; background:#000; border:1px solid #333; border-radius:40px;
           padding:10px 22px; margin-top:1rem; width:fit-content; font-size:20px; color:#fff; }
  h2 { margin:.9rem 0 .2rem; font-size:1.15rem; color:#fff; } .credit { color:#888; font-size:.85rem; margin:.3rem 0; }
</style></head><body>
<h1>Pomodorino: photo icons</h1>
<p class="intro">Real tomato photos with the background removed, shown on black like on the watch.
Each has the large version, the real size (54×54 px) and a mock of the watch's app list.</p>
<div class="grid">
  <figure>
    <div class="row"><img src="your_yellow_360.png" width="300" height="300" alt="Your yellow pear tomato">
      <div class="small"><img src="your_yellow_54.png" width="54" height="54" alt=""><span>real size</span></div></div>
    <div class="watch"><img src="your_yellow_54.png" width="54" height="54" alt=""><span>Pomodorino</span></div>
    <figcaption><h2>1 · Your yellow pear tomato</h2><p class="credit">Your photo</p></figcaption>
  </figure>
  <figure>
    <div class="row"><img src="orange_datterino_360.png" width="300" height="300" alt="Orange datterino">
      <div class="small"><img src="orange_datterino_54.png" width="54" height="54" alt=""><span>real size</span></div></div>
    <div class="watch"><img src="orange_datterino_54.png" width="54" height="54" alt=""><span>Pomodorino</span></div>
    <figcaption><h2>2 · Orange datterino</h2><p class="credit">Photo: Fructibus, <a href="https://commons.wikimedia.org/wiki/File:Cherry_Bambelo_tomato_2017_A.jpg">CC0</a> (Wikimedia Commons)</p></figcaption>
  </figure>
  <figure>
    <div class="row"><img src="orange_pile_360.png" width="300" height="300" alt="Orange datterini">
      <div class="small"><img src="orange_pile_54.png" width="54" height="54" alt=""><span>real size</span></div></div>
    <div class="watch"><img src="orange_pile_54.png" width="54" height="54" alt=""><span>Pomodorino</span></div>
    <figcaption><h2>3 · Orange datterini</h2><p class="credit">Photo: Fructibus, <a href="https://commons.wikimedia.org/wiki/File:Cherry_Bambelo_tomatoes_2017_A1.jpg">CC0</a> (Wikimedia Commons)</p></figcaption>
  </figure>
  <figure>
    <div class="row"><img src="red_datterino_360.png" width="300" height="300" alt="Red datterino">
      <div class="small"><img src="red_datterino_54.png" width="54" height="54" alt=""><span>real size</span></div></div>
    <div class="watch"><img src="red_datterino_54.png" width="54" height="54" alt=""><span>Pomodorino</span></div>
    <figcaption><h2>4 · Red datterino</h2><p class="credit">Photo: NeoMeesje, <a href="https://commons.wikimedia.org/wiki/File:Cherry_tomato_1.jpg">CC BY-SA 4.0</a> (Wikimedia Commons)</p></figcaption>
  </figure>
  <figure>
    <div class="row"><img src="red_ciliegino_360.png" width="300" height="300" alt="Red ciliegino">
      <div class="small"><img src="red_ciliegino_54.png" width="54" height="54" alt=""><span>real size</span></div></div>
    <div class="watch"><img src="red_ciliegino_54.png" width="54" height="54" alt=""><span>Pomodorino</span></div>
    <figcaption><h2>5 · Red ciliegino</h2><p class="credit">Photo: Fructibus, <a href="https://commons.wikimedia.org/wiki/File:Cross_section_of_Cherry_Nebula_tomato_2017_I.jpg">CC0</a> (Wikimedia Commons)</p></figcaption>
  </figure>
  <figure>
    <div class="row"><img src="vine_single_360.png" width="300" height="300" alt="Ciliegino with calyx">
      <div class="small"><img src="vine_single_54.png" width="54" height="54" alt=""><span>real size</span></div></div>
    <div class="watch"><img src="vine_single_54.png" width="54" height="54" alt=""><span>Pomodorino</span></div>
    <figcaption><h2>6 · Ciliegino with calyx</h2><p class="credit">Photo: Luc Viatour, <a href="https://commons.wikimedia.org/wiki/File:Tomates_cerises_Luc_Viatour.jpg">CC BY-SA 3.0</a> (Wikimedia Commons)</p></figcaption>
  </figure>
  <figure>
    <div class="row"><img src="vine_bunch_360.png" width="300" height="300" alt="Ciliegini on the vine">
      <div class="small"><img src="vine_bunch_54.png" width="54" height="54" alt=""><span>real size</span></div></div>
    <div class="watch"><img src="vine_bunch_54.png" width="54" height="54" alt=""><span>Pomodorino</span></div>
    <figcaption><h2>7 · Ciliegini on the vine</h2><p class="credit">Photo: Luc Viatour, <a href="https://commons.wikimedia.org/wiki/File:Tomates_cerises_Luc_Viatour.jpg">CC BY-SA 3.0</a> (Wikimedia Commons)</p></figcaption>
  </figure>
</div></body></html>
