<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Pomodorino icon drafts</title>
<style>
  body { background:#111; color:#ddd; font-family:system-ui,sans-serif; margin:2rem; }
  .intro { color:#999; max-width:60rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(460px,1fr)); gap:2rem; margin-top:1.5rem; }
  figure { margin:0; background:#1b1b1b; border-radius:16px; padding:1.2rem; }
  .row { display:flex; align-items:flex-end; gap:1.5rem; }
  .small { display:flex; flex-direction:column; align-items:center; gap:.4rem; color:#777; font-size:.8rem; }
  .watch { display:flex; align-items:center; gap:14px; background:#000; border-radius:40px; padding:10px 22px; margin-top:1rem;
           width:fit-content; font-size:20px; color:#fff; }
  h2 { margin:.9rem 0 .2rem; font-size:1.15rem; color:#fff; } p { margin:.3rem 0; line-height:1.4; }
</style></head><body>
<h1>Pomodorino: simple icon drafts</h1>
<p class="intro">Original designs, made to read at a glance. Each shows the large draft, the real size (54×54 px) and
how it looks in the watch's app list.</p>
<div class="grid">
  <figure>
    <div class="row"><img src="clock_360.png" width="360" height="360" alt="Clock tomato icon">
      <div class="small"><img src="clock_54.png" width="54" height="54" alt=""><span>real size</span></div></div>
    <div class="watch"><img src="clock_54.png" width="54" height="54" alt=""><span>Pomodorino</span></div>
    <figcaption><h2>1 · Clock tomato</h2><p>The tomato is the clock face: white hands and four hour dots.</p></figcaption>
  </figure>

  <figure>
    <div class="row"><img src="ring_360.png" width="360" height="360" alt="Ring icon">
      <div class="small"><img src="ring_54.png" width="54" height="54" alt=""><span>real size</span></div></div>
    <div class="watch"><img src="ring_54.png" width="54" height="54" alt=""><span>Pomodorino</span></div>
    <figcaption><h2>2 · Ring</h2><p>The app's own progress ring on a dark badge, with the leaf in the gap at the top. Matches the main screen.</p></figcaption>
  </figure>

  <figure>
    <div class="row"><img src="stopwatch_360.png" width="360" height="360" alt="Stopwatch icon">
      <div class="small"><img src="stopwatch_54.png" width="54" height="54" alt=""><span>real size</span></div></div>
    <div class="watch"><img src="stopwatch_54.png" width="54" height="54" alt=""><span>Pomodorino</span></div>
    <figcaption><h2>3 · Stopwatch</h2><p>The stem becomes the stopwatch crown and button; white dial with ticks.</p></figcaption>
  </figure>

  <figure>
    <div class="row"><img src="slice_360.png" width="360" height="360" alt="Slice icon">
      <div class="small"><img src="slice_54.png" width="54" height="54" alt=""><span>real size</span></div></div>
    <div class="watch"><img src="slice_54.png" width="54" height="54" alt=""><span>Pomodorino</span></div>
    <figcaption><h2>4 · Slice</h2><p>A cut tomato whose seeds sit where the hours are, with clock hands in the middle.</p></figcaption>
  </figure>

  <figure>
    <div class="row"><img src="play_360.png" width="360" height="360" alt="Play icon">
      <div class="small"><img src="play_54.png" width="54" height="54" alt=""><span>real size</span></div></div>
    <div class="watch"><img src="play_54.png" width="54" height="54" alt=""><span>Pomodorino</span></div>
    <figcaption><h2>5 · Play</h2><p>Tomato with a start button: "press to start a pomodoro".</p></figcaption>
  </figure>

  <figure>
    <div class="row"><img src="hourglass_360.png" width="360" height="360" alt="Hourglass icon">
      <div class="small"><img src="hourglass_54.png" width="54" height="54" alt=""><span>real size</span></div></div>
    <div class="watch"><img src="hourglass_54.png" width="54" height="54" alt=""><span>Pomodorino</span></div>
    <figcaption><h2>6 · Hourglass</h2><p>A little tomato left in the top bulb, a full one forming in the bottom.</p></figcaption>
  </figure>

  <figure>
    <div class="row"><img src="longshadow_360.png" width="360" height="360" alt="Long shadow icon">
      <div class="small"><img src="longshadow_54.png" width="54" height="54" alt=""><span>real size</span></div></div>
    <div class="watch"><img src="longshadow_54.png" width="54" height="54" alt=""><span>Pomodorino</span></div>
    <figcaption><h2>7 · Long shadow</h2><p>Flat tomato on a teal badge with a long diagonal shadow; pops on black.</p></figcaption>
  </figure>

  <figure>
    <div class="row"><img src="kawaii_360.png" width="360" height="360" alt="Kawaii icon">
      <div class="small"><img src="kawaii_54.png" width="54" height="54" alt=""><span>real size</span></div></div>
    <div class="watch"><img src="kawaii_54.png" width="54" height="54" alt=""><span>Pomodorino</span></div>
    <figcaption><h2>8 · Kawaii</h2><p>A happy, focused little tomato with closed eyes and blush.</p></figcaption>
  </figure>
</div></body></html>
