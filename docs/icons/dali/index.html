<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Pomodorino Dalí icons</title>
<style>
  body { background:#111; color:#ddd; font-family:system-ui,sans-serif; margin:2rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(500px,1fr)); gap:2rem; margin-top:1.5rem; }
  figure { margin:0; background:#1b1b1b; border-radius:16px; padding:1.2rem; }
  .row { display:flex; align-items:flex-end; gap:1.5rem; }
  .small { display:flex; flex-direction:column; align-items:center; gap:.4rem; color:#777; font-size:.8rem; }
  h2 { margin:.9rem 0 .2rem; font-size:1.15rem; color:#fff; } p { margin:.3rem 0; line-height:1.4; }
</style></head><body>
<h1>Pomodorino: Dalí, more movement</h1>
<div class="grid">
  <figure>
    <div class="row"><img src="dali_A_400.png" width="400" height="400" alt="Dalí Drip icon">
      <div class="small"><img src="dali_A_54.png" width="54" height="54" alt=""><span>real size</span></div></div>
    <figcaption><h2>A · Drip</h2><p>Long drips over the ledge, a falling drop, a warped clock with bent hands, wispy clouds, raking shadows.</p></figcaption>
  </figure>

  <figure>
    <div class="row"><img src="dali_B_400.png" width="400" height="400" alt="Dalí Swirl icon">
      <div class="small"><img src="dali_B_54.png" width="54" height="54" alt=""><span>real size</span></div></div>
    <figcaption><h2>B · Swirl</h2><p>Same melt under a swirling sky around the sun; the leaf is blown off with motion streaks.</p></figcaption>
  </figure>

  <figure>
    <div class="row"><img src="dali_C_400.png" width="400" height="400" alt="Dalí Dream icon">
      <div class="small"><img src="dali_C_54.png" width="54" height="54" alt=""><span>real size</span></div></div>
    <figcaption><h2>C · Dream</h2><p>The melt plus a long-legged elephant carrying a tomato across the distant desert.</p></figcaption>
  </figure>
</div></body></html>
